<!DOCTYPE html>
<html>

<head>

<title>Mental Health Analyzer</title>

<style>

body{
    font-family: Arial;
    background: #f2f2f2;
    text-align: center;
    padding-top: 100px;
}

.box{
    background: white;
    width: 400px;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
}

textarea{
    width: 100%;
    height: 100px;
}

button{
    background: purple;
    color: white;
    padding: 10px 20px;
    border: none;
    margin-top: 10px;
}

</style>

</head>

<body>

<div class="box">

<h2>AI Mental Health Analyzer</h2>

<form action="/analyze" method="POST">

<textarea name="text"
placeholder="Enter your feelings"></textarea>

<br><br>

<button type="submit">
Analyze
</button>

</form>

{% if result %}

<h3>{{ result }}</h3>

{% endif %}

</div>

</body>

</html>
